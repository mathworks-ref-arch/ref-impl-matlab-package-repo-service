services:
  mpm-repo-server:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - PORT=${PORT:-8080}
      - ARTIFACTORY_URL
      - ARTIFACTORY_REPO_KEY
      - ARTIFACTORY_SERVICE_TOKEN
      - USE_API_DOWNLOAD_URLS
      - BASE_URL
      - ENABLE_PUBLISH
