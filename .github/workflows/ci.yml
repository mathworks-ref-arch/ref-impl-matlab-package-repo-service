name: CI

on:
  pull_request:
  push:
    branches: [main, publish]

jobs:
  test:
    # Public repo (mathworks-ref-arch) uses GitHub-hosted runners; internal GHE uses self-hosted.
    runs-on: ${{ github.repository_owner == 'mathworks-ref-arch' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "runner-source=AWS", "Linux", "X64"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - run: cd artifactory-server && go vet ./...
      - run: sudo apt-get update && sudo apt-get install -y gcc
      - run: cd artifactory-server && CGO_ENABLED=1 go test -v -race -coverprofile=coverage.out ./...
      - run: cd artifactory-server && go tool cover -func=coverage.out
