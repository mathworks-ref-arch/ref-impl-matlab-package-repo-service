name: Performance Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  perf-test:
    runs-on: [self-hosted, runner-source=AWS, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Run performance tests
        run: |
          cd artifactory-server/perf-test
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PERF_PACKAGE_COUNTS="100" \
            PERF_CONCURRENCY_LEVELS="5,25" \
            PERF_DURATION="5s" \
            PERF_SOAK_DURATION="30s" \
            go run ./cmd/orchestrator
          else
            go run ./cmd/orchestrator
          fi
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: perf-results
          path: artifactory-server/perf-test/results.json
